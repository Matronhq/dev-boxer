# Dev Boxer config — copy to config.yml and edit, or run `wizard.rb`.

user:
  name: dan
  ssh_public_key: "ssh-ed25519 AAAAC3Nz... user@laptop"

ssh:
  port: 2222

desktop:
  enabled: true

docker:
  prune:
    interval: 2h
    keep_until: 4h

claude:
  plugins:
    - superpowers
    - context7
    - serena

matrix:
  mode: bundled            # bundled | external | disabled
  homeserver: matrix.example.com
  bot_username: claude-bot

cloudflare:
  enabled: false
  account_id: ""
  zone_id: ""
  api_token: ""           # admin token, used once to create the tunnel — wiped after
  zone_api_token: ""      # zone-scoped token, deployed to ~/.cloudflare/ for user tools
  tunnel:
    hostname: dev.example.com
    hostname_matrix: matrix.example.com
    hostname_viewer: viewer.example.com
    config_managed_locally: false   # if true, don't overwrite /etc/cloudflared/config.yml
