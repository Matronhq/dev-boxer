# Dev Boxer config — copy to config.yml and edit, or run `wizard.rb`.

user:
  name: dan
  ssh_public_key: "ssh-ed25519 AAAAC3Nz... user@laptop"

ssh:
  port: 2222

desktop:
  enabled: true

docker:
  prune:
    interval: 2h
    keep_until: 4h

claude:
  plugins:
    - superpowers
    - context7
    - serena

matrix:
  mode: bundled                 # bundled | external | disabled
  server_domain: matrix.example.com   # used in bundled mode for the matron server name
  homeserver_url: ""            # only set for `external` mode (e.g. https://matrix.org)
  bot_username: claude-bot
  user_username: dan            # local part of your matrix user
  user_password: ""             # set if you want a specific password; otherwise auto-generated
  # bot_access_token, bridge_room_id, hmac_secret are populated automatically
  # on first bundled run and persisted back here for idempotency.

cloudflare:
  enabled: false
  account_id: ""
  zone_id: ""
  api_token: ""
  tunnel:
    hostname: dev.example.com
    managed_locally: false
