# Dev Boxer config — copy to config.yml and edit, or run `wizard.rb`.

user:
  name: dan
  ssh_public_key: "ssh-ed25519 AAAAC3Nz... user@laptop"

ssh:
  port: 2222

desktop:
  enabled: true

docker:
  # Optional: relocate Docker + containerd storage to a separate volume
  # (e.g. a big data disk or an encrypted /secure mount). Leave nil for the
  # system default under /var/lib/{docker,containerd}.
  data_root: null         # e.g. "/secure/docker"
  containerd_root: null   # e.g. "/secure/containerd" (auto-derived from data_root if nil)
  prune:
    interval: 2h          # how often docker-prune.timer fires
    keep_until: 4h        # untag images / build cache older than this

claude:
  plugins:
    - superpowers
    - context7
    - serena

matrix:
  mode: bundled            # bundled | external | disabled
  server_domain: matrix.example.com   # the matrix server name (e.g. matrix.example.com)
  user_username: dan        # local part of your matrix user (default: linux user.name)
  bot_username: null        # default: claude-bot-<hostname>; override here if you want
  user_password: null       # leave nil to auto-generate; printed/persisted on first run
  # The next four are populated by the matrix-bridge module on first run and
  # should not be hand-edited. They survive subsequent runs (idempotency):
  # bot_access_token: ...
  # recovery_key: ...
  # bridge_room_id: ...
  # hmac_secret: ...

hello_world:
  enabled: false          # if true, deploys a localhost:port "hello world" smoke-test service
  port: 9810

cloudflare:
  enabled: false
  account_id: ""
  zone_id: ""
  api_token: ""           # admin token, used once to create the tunnel — wiped after
  zone_api_token: ""      # zone-scoped token, deployed to ~/.cloudflare/ for user tools
  tunnel:
    hostname: dev.example.com
    hostname_matrix: matrix.example.com
    hostname_viewer: viewer.example.com
    config_managed_locally: false   # if true, don't overwrite /etc/cloudflared/config.yml
