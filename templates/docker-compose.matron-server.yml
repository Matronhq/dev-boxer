# Matron Server (Matrix homeserver) — deployed by dev-boxer
services:
  matron-server:
    image: ghcr.io/matronhq/matron-server:latest
    container_name: matron-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:6167:6167"
    volumes:
      - matron_server_data:/var/lib/matron-server
    environment:
      MATRON_SERVER_SERVER_NAME: "{{MATRIX_SERVER_DOMAIN}}"
      MATRON_SERVER_PORT: 6167
      MATRON_SERVER_ADDRESS: 0.0.0.0
      MATRON_SERVER_ALLOW_REGISTRATION: "false"
      MATRON_SERVER_ALLOW_FEDERATION: "false"
      MATRON_SERVER_ALLOW_ENCRYPTION: "true"
      MATRON_SERVER_TRUSTED_SERVERS: '["matrix.org"]'
      MATRON_SERVER_MAX_REQUEST_SIZE: 20000000
      MATRON_SERVER_NEW_USER_DISPLAYNAME_SUFFIX: ""
      MATRON_SERVER_WELL_KNOWN__CLIENT: "https://{{MATRIX_SERVER_DOMAIN}}"

volumes:
  matron_server_data:
