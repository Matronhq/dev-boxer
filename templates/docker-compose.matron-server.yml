# Matron Server (Matrix homeserver) — deployed by dev-boxer
services:
  matron-server:
    image: ghcr.io/matronhq/matron-server:latest
    container_name: matron-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:6167:6167"
    volumes:
      - matron_server_data:/var/lib/tuwunel
    environment:
      TUWUNEL_SERVER_NAME: "{{MATRIX_SERVER_DOMAIN}}"
      TUWUNEL_DATABASE_PATH: /var/lib/tuwunel
      TUWUNEL_PORT: 6167
      TUWUNEL_ADDRESS: 0.0.0.0
      TUWUNEL_ALLOW_REGISTRATION: "false"
      TUWUNEL_ALLOW_FEDERATION: "false"
      TUWUNEL_ALLOW_ENCRYPTION: "true"
      TUWUNEL_TRUSTED_SERVERS: '["matrix.org"]'
      TUWUNEL_MAX_REQUEST_SIZE: 20000000
      TUWUNEL_NEW_USER_DISPLAYNAME_SUFFIX: ""
      TUWUNEL_WELL_KNOWN__CLIENT: "https://{{MATRIX_SERVER_DOMAIN}}"

volumes:
  matron_server_data:
